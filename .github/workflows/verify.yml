name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Test production server on desktop and mobile
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/fantasy-pancake-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null "$PLAYWRIGHT_BASE_URL"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/fantasy-pancake-server.log
            exit 1
          fi
          npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-failure
          path: |
            test-results/
            playwright-report/
            /tmp/fantasy-pancake-server.log
          retention-days: 7
          if-no-files-found: ignore
